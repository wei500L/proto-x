<main><header><a href="/">Field notes</a></header><h1>A habit of walking</h1>
<p>A familiar route changes with the light. Taking the same short walk each week makes those changes easier to notice.</p>
<p>Leave a little time without a destination. Look at the trees, stop at a bench, and return by a different street.</p>
